blueprint:
  name: Four Button Switch - Two Light Groups
  description: |
    Control two light groups with a four-button switch.
    - Button 1: Turn on first light
    - Button 2: Turn on second light
    - Button 3: Turn off first light
    - Button 4: Turn off second light
  domain: automation
  input:
    switch_device:
      name: Switch Device
      description: The four-button switch to use
      selector:
        device:
          filter:
            - integration: mqtt
    first_light_mqtt_topic:
      name: First Light/Group MQTT Topic
      description: The zigbee2mqtt topic for the first light (e.g., zigbee2mqtt/living_room_light)
      selector:
        text:
    second_light_mqtt_topic:
      name: Second Light/Group MQTT Topic
      description: The zigbee2mqtt topic for the second light (e.g., zigbee2mqtt/bedroom_light)
      selector:
        text:
    circadian_switch:
      name: Circadian Lighting Switch
      description: Circadian lighting switch to control brightness and color temperature
      selector:
        entity:
          filter:
            - domain: switch
              integration: circadian_lighting

triggers:
  - domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: press_1
    trigger: device
    id: top-on
  - domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: press_3
    trigger: device
    id: top-off
  - domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: press_2
    trigger: device
    id: bottom-on
  - domain: mqtt
    device_id: !input switch_device
    type: action
    subtype: press_4
    trigger: device
    id: bottom-off

conditions: []

actions:
  - variables:
      _circadian: !input circadian_switch
      _first_light_topic: !input first_light_mqtt_topic
      _second_light_topic: !input second_light_mqtt_topic
      _color_temp: "{{ (1000000 / (state_attr(_circadian, 'colortemp') | int)) | int }}"
      _brightness: "{{ (state_attr(_circadian, 'brightness') * 2.55) | int }}"

  - choose:
      - conditions:
          - condition: trigger
            id:
              - top-on
        sequence:
          - service: mqtt.publish
            data:
              topic: "{{ _first_light_topic }}/set"
              payload: >
                {
                  "state": "ON",
                  "color_temp": {{ _color_temp }},
                  "brightness": {{ _brightness }}
                }
      - conditions:
          - condition: trigger
            id:
              - top-off
        sequence:
          - service: mqtt.publish
            data:
              topic: "{{ _first_light_topic }}/set"
              payload: '{"state": "OFF"}'
      - conditions:
          - condition: trigger
            id:
              - bottom-on
        sequence:
          - service: mqtt.publish
            data:
              topic: "{{ _second_light_topic }}/set"
              payload: >
                {
                  "state": "ON",
                  "color_temp": {{ _color_temp }},
                  "brightness": {{ _brightness }}
                }
      - conditions:
          - condition: trigger
            id:
              - bottom-off
        sequence:
          - service: mqtt.publish
            data:
              topic: "{{ _second_light_topic }}/set"
              payload: '{"state": "OFF"}'

mode: single
